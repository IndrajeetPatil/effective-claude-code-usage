<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effective Claude Code Usage Social Card</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap");

      :root {
        --bg: #0d1117;
        --green: #22c55e;
        --blue: #38bdf8;
        --muted: #8b949e;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Space Grotesk", system-ui, sans-serif;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .copy {
        position: absolute;
        left: 88px;
        top: 210px;
        width: 660px;
      }

      h1 {
        margin: 0 0 32px;
        color: var(--green);
        font-size: 76px;
        font-weight: 700;
        line-height: 1.06;
      }

      .subtitle {
        margin: 0 0 44px;
        color: var(--blue);
        font-size: 30px;
        font-weight: 600;
        line-height: 1.3;
      }

      .byline {
        margin: 0;
        color: var(--muted);
        font-size: 24px;
        line-height: 1.3;
      }

      .workshop {
        position: absolute;
        top: 116px;
        right: 32px;
        width: 816px;
        height: 612px;
        object-fit: contain;
      }

      .site {
        position: absolute;
        left: 88px;
        bottom: 72px;
        margin: 0;
        color: var(--muted);
        font-size: 21px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="copy">
        <h1>Effective Claude<br />Code Usage</h1>
        <p class="subtitle">From CLI to Cognitive Partner</p>
        <p class="byline">Indrajeet Patil &nbsp;·&nbsp; 2026</p>
      </section>
      <img
        class="workshop"
        src="illustration-title-workshop.webp"
        alt="The orange Anthropic symbol in a terminal workshop with linked code modules and green test checks."
      />
      <p class="site">indrapatil.com/effective-claude-code-usage</p>
    </main>
  </body>
</html>
