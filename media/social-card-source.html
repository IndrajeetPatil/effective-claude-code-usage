<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effective Claude Code Usage Social Card</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Source+Serif+4:opsz,wght@8..60,400&display=swap");

      :root {
        --bg: #fdfdf7;
        --panel: #f6f5ef;
        --text: #171717;
        --muted: #5f5f5d;
        --hairline: #e2e1da;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
      }

      .frame {
        display: grid;
        grid-template-columns: 1fr 520px;
        gap: 64px;
        height: 100%;
        padding: 96px 96px 88px;
      }

      .copy {
        display: flex;
        flex-direction: column;
      }


      h1 {
        margin: 0 0 36px;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 128px;
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.015em;
      }

      .subtitle {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 34px;
        line-height: 1.35;
      }

      .site {
        margin: auto 0 0;
        padding-top: 28px;
        border-top: 1px solid var(--hairline);
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
      }

      /* The official Claude spark mark (media/claude-spark.svg), unmodified. */
      .mark {
        align-self: center;
        display: grid;
        place-items: center;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: var(--panel);
        border: 1px solid var(--hairline);
      }

      .mark img {
        width: 260px;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="copy">
        <h1>Effective<br />Claude Code<br />Usage</h1>
        <p class="subtitle">Practical habits for reliable work with a coding agent.</p>
        <p class="site">indrapatil.com/effective-claude-code-usage</p>
      </section>
      <div class="mark">
        <img src="claude-spark.svg" alt="" />
      </div>
    </main>
  </body>
</html>
