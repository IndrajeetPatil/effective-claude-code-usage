[project]
name = "effective-claude-code-usage"
version = "1.0.0"
description = "A comprehensive guide to using Claude Code effectively as a CLI agent"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "CC0 1.0 Universal" }
authors = [
    { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" }
]
keywords = [
    "claude-code",
    "ai-agents",
    "cli",
    "anthropic",
    "software-engineering",
    "llms-txt"
]
dependencies = ["ipykernel>=7.4.0", "nbclient>=0.11.0", "pyyaml>=6.0.3"]

[tool.uv]
required-version = ">=0.12.17"

[dependency-groups]
dev = ["matplotlib>=3.11.2"]
